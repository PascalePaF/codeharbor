name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
      - name: Run responsive desktop smoke test
        shell: pwsh
        run: |
          $env:CODEHARBOR_SMOKE_USER_DATA = Join-Path $env:RUNNER_TEMP "codeharbor-smoke-user-data"
          npm run smoke
      - name: Upload responsive smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-responsive-smoke
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        run: npm audit --audit-level=high
