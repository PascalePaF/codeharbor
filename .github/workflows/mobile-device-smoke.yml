name: Mobile simulator smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.9"
  APP_DIRECTORY: apps/codeharbor_flutter

jobs:
  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd apps/codeharbor_flutter && flutter test integration_test/app_smoke_test.dart -d emulator-5554

  ios-simulator:
    name: iPhone simulator smoke test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Boot an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" -a "$UDID" != "null"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run iOS integration smoke test
        working-directory: ${{ env.APP_DIRECTORY }}
        run: flutter test integration_test/app_smoke_test.dart -d "${{ steps.simulator.outputs.udid }}"

  macos-app:
    name: macOS release package validation
    # The standard macos-15 label is an arm64 virtual machine whose hosted
    # graphics session can terminate Flutter desktop apps before VM attach.
    # Intel runners expose the Metal-capable GUI session needed by this test.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build sandboxed macOS release app
        working-directory: ${{ env.APP_DIRECTORY }}
        run: flutter build macos --release
      - name: Validate bundle, signature, entitlements and Intel binary
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: bash
        run: |
          APP_BUNDLE="build/macos/Build/Products/Release/CodeHarbor.app"
          APP_BINARY="build/macos/Build/Products/Release/CodeHarbor.app/Contents/MacOS/CodeHarbor"
          INFO_PLIST="$APP_BUNDLE/Contents/Info.plist"
          ENTITLEMENTS="$RUNNER_TEMP/codeharbor-entitlements.plist"
          test -d "$APP_BUNDLE"
          test -x "$APP_BINARY"
          plutil -lint "$INFO_PLIST"
          test "$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")" = "com.codeharbor.app"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign -d --entitlements :- "$APP_BUNDLE" >"$ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$ENTITLEMENTS")" = "true"
          lipo -archs "$APP_BINARY" | grep -qw x86_64
